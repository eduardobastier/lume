# Lume settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Optional: a free YouTube Data API v3 key (console.cloud.google.com). With it, the picks are what's trending on
# YouTube in your country (tmdb_region), and "Watch" opens the video in the YouTube app.
youtube_key=

# true: the picks are your country's top movies and shows on any streaming service (shown for you to see; OK only
# opens the ones on an app the TV has). false: only what is on the TV's own apps.
recs_all=false

# true: only new releases (movies from the past 4 months, shows that premiered in the past 6)
recs_recent=false

# Only these genres in the picks (comma-separated; empty = all): thriller, action, comedy, horror, drama, scifi,
# animation, romance
recs_genres=

# Wallpapers (when the recommendations are off) come from Bing or Wallhaven, chosen on the TV. Optionally also a public
# GitHub repository (owner/name) and the folder in it with the
# images (JPG, PNG or WebP, ideally 1920×1080). Add or delete images there and the TVs follow. Empty = no GitHub option.
wallpaper_repo=eduardobastier/my-tv-wallpapers
wallpaper_path=wallpapers

# Over-the-air updates: the GitHub repository (owner/name) whose latest release has the APK. Empty = no updates.
update_repo=eduardobastier/my-tv

# Optional: a Telegram bot (create one with @BotFather) and your chat id with it. With both, Settings → Updates
# gets "Send diagnostics": the TV's screensaver/sound state and its full log arrive as a file in that chat, so you
# can read them without the TV in front of you. The token ends up inside the APK. Empty = off.
telegram_bot_token=
telegram_chat_id=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en or pt
language=auto

# false hides the crypto prices (home screen, drawer and screensaver)
show_prices=true

# Crypto prices: USD, BRL, EUR...
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false
